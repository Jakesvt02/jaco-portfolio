<section class="experience" id="experience">
  <div class="container">
    <div class="section-label">Where I've worked</div>
    <h2>Experience</h2>
    <div class="timeline">
      @for (role of roles; track role.company + role.period; let i = $index) {
        <div class="timeline-item" reveal [style.--delay]="i * 120 + 'ms'">
          <div class="timeline-left">
            <div class="timeline-dot"></div>
            <div class="timeline-line"></div>
          </div>
          <div class="timeline-body">
            <div class="role-header">
              <div>
                <h3>{{ role.title }}</h3>
                <div class="role-company">{{ role.company }}</div>
              </div>
              <div class="role-meta">
                <span class="role-period">{{ role.period }}</span>
                <span class="role-location">{{ role.location }}</span>
              </div>
            </div>
            <p>{{ role.description }}</p>
            <div class="role-skills">
              @for (skill of role.skills; track skill) {
                <span class="skill-tag">{{ skill }}</span>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
